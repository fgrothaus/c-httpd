<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>c-httpd Server</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.2);
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 0 15px var(--accent-glow);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(34, 197, 94, 0.1);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.2);
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
        }

        h1 {
            font-size: 1.75rem;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        p {
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .details {
            background: #0b1120;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.85rem;
            color: var(--accent);
        }

        .details div {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
        }

        .details span {
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <main class="card">
        <div class="status-badge">
            <span class="status-dot"></span> 200 OK
        </div>
        <h1>c-httpd läuft!</h1>
        <p>Der HTTP-Server liefert dynamische Responses, Header und statische Assets erfolgreich über Sockets aus.</p>

        <div class="details">
            <div><span>Protokoll:</span> HTTP/1.1</div>
            <div><span>Socket:</span> POSIX TCP</div>
            <div><span>Favicon:</span> /favicon.ico</div>
        </div>
    </main>

</body>
</html>
